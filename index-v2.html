<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Montreal Racing Team — MRT | Sim racing d'endurance sur Le Mans Ultimate</title>
<meta name="description" content="Montreal Racing Team (MRT) — écurie esport de sim racing d'endurance sur Le Mans Ultimate : Hypercar, LMP2, LMP3 et LMGT3. Actualités, calendrier, résultats, boutique et partenaires.">
<link rel="canonical" href="https://montrealracingteam.ca/">
<meta name="theme-color" content="#0057FF">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Montreal Racing Team">
<meta property="og:locale" content="fr_CA">
<meta property="og:title" content="Montreal Racing Team — MRT">
<meta property="og:description" content="Écurie esport de sim racing d'endurance sur Le Mans Ultimate — Hypercar, LMP2, LMP3, LMGT3.">
<meta property="og:url" content="https://montrealracingteam.ca/">
<meta property="og:image" content="https://montrealracingteam.ca/og-image.png">
<meta name="twitter:card" content="summary_large_image">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --mrt-blue:#0057FF;
    --mrt-blue-deep:#0040C2;
    --mrt-ink:#05070D;
    --mrt-deep:#0A1128;
    --mrt-panel:#0E1530;
    --mrt-white:#F4F6FB;
    --mrt-fog:#9AA6C4;
    --mrt-ice:#8FA6FF;
    --mrt-flag:#CE1126;
    --line:rgba(244,246,251,0.10);
    --line-strong:rgba(244,246,251,0.18);
    --display:'Bebas Neue', sans-serif;
    --body:'Inter', sans-serif;
    --mono:'JetBrains Mono', monospace;
  }

  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--mrt-ink);
    color:var(--mrt-white);
    font-family:var(--body);
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }
  img{max-width:100%;display:block;}
  a{color:inherit;text-decoration:none;}
  ::selection{background:var(--mrt-blue);color:#fff;}

  .wrap{max-width:1280px;margin:0 auto;padding:0 32px;}
  
  .eyebrow{
    font-family:var(--mono);
    font-size:12px;
    letter-spacing:0.18em;
    text-transform:uppercase;
    color:var(--mrt-ice);
    display:flex;
    align-items:center;
    gap:10px;
  }
  .eyebrow::before{
    content:'';
    width:7px;height:7px;
    background:var(--mrt-blue);
    border-radius:1px;
    transform:rotate(45deg);
    flex-shrink:0;
  }

  h1,h2,h3{font-family:var(--display);font-weight:400;letter-spacing:0.01em;text-transform:uppercase;line-height:0.95;}
  h1{font-size:48px;}
  h2{font-size:32px;}

  /* NEWS SECTION */
  section#news{padding:80px 0;}
  .news-header{margin-bottom:40px;}
  .news-header h1{margin-bottom:12px;}
  .news-header p{color:var(--mrt-fog);font-size:15px;max-width:600px;}

  .featured-article{
    background:var(--mrt-panel);border:1px solid var(--line);
    overflow:hidden;border-radius:2px;margin-bottom:32px;
    display:grid;grid-template-columns:1fr 1fr;gap:0;
    align-items:stretch;
  }
  .featured-article.no-image{grid-template-columns:1fr;}
  
  .featured-img{width:100%;height:100%;object-fit:cover;min-height:300px;}
  .featured-content{padding:40px;display:flex;flex-direction:column;justify-content:center;}
  .featured-meta{font-family:var(--mono);font-size:11px;color:var(--mrt-fog);margin-bottom:12px;letter-spacing:0.06em;}
  .featured-title{font-size:36px;margin-bottom:16px;line-height:1;}
  .featured-excerpt{color:var(--mrt-fog);font-size:14px;line-height:1.6;margin-bottom:24px;}
  .featured-btn{
    display:inline-block;
    font-family:var(--mono);font-size:11px;letter-spacing:0.08em;
    text-transform:uppercase;padding:10px 18px;border:1px solid var(--mrt-ice);
    color:var(--mrt-ice);border-radius:2px;transition:all 0.2s;
    width:fit-content;
  }
  .featured-btn:hover{background:var(--mrt-ice);color:var(--mrt-ink);}

  .other-articles{
    display:grid;grid-template-columns:repeat(auto-fill, minmax(280px, 1fr));
    gap:16px;
  }
  .article-item{
    background:var(--mrt-panel);border:1px solid var(--line);overflow:hidden;
    border-radius:2px;display:flex;flex-direction:column;transition:border-color 0.2s;
    cursor:pointer;
  }
  .article-item:hover{border-color:var(--mrt-ice);}

  .article-img{width:100%;height:160px;object-fit:cover;}
  .article-body{padding:16px;display:flex;flex-direction:column;flex:1;}
  .article-meta{font-family:var(--mono);font-size:10px;color:var(--mrt-fog);margin-bottom:8px;}
  .article-title{font-size:14px;margin-bottom:8px;font-weight:600;line-height:1.3;}
  .article-excerpt{color:var(--mrt-fog);font-size:12px;line-height:1.5;margin-bottom:12px;flex:1;
    overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;}

  .loading{text-align:center;color:var(--mrt-fog);padding:60px 0;font-size:14px;}

  /* Modal */
  .modal{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.9);
    z-index:1000;align-items:center;justify-content:center;padding:20px;}
  .modal.active{display:flex;}
  .modal-content{background:var(--mrt-panel);border:1px solid var(--line);border-radius:2px;
    width:100%;max-width:700px;max-height:90vh;overflow-y:auto;padding:40px;}
  .modal-close{position:absolute;top:20px;right:20px;background:none;border:none;
    color:var(--mrt-white);font-size:28px;cursor:pointer;}
  .modal-title{font-size:32px;margin-bottom:12px;}
  .modal-meta{font-family:var(--mono);font-size:11px;color:var(--mrt-fog);margin-bottom:24px;}
  .modal-img{width:100%;max-height:300px;object-fit:cover;margin-bottom:24px;border-radius:2px;}
  .modal-body{color:var(--mrt-fog);line-height:1.7;font-size:14px;}
  .modal-body h3{color:var(--mrt-white);margin:20px 0 10px;font-size:18px;}
  .modal-body p{margin-bottom:12px;}
  .modal-body a{color:var(--mrt-ice);text-decoration:underline;}

  @media (max-width:900px){
    .featured-article{grid-template-columns:1fr;}
    .featured-content{padding:24px;}
    .featured-title{font-size:26px;}
    .wrap{padding:0 20px;}
    h1{font-size:36px;}
    h2{font-size:24px;}
  }

  @media (max-width:600px){
    .other-articles{grid-template-columns:1fr;}
    .modal-content{padding:20px;}
  }
</style>
</head>
<body>

<main class="wrap">
  <section id="news">
    <div class="news-header">
      <div class="eyebrow">ACTUALITÉS</div>
      <h1>Dernières actualités MRT</h1>
      <p>Résultats, événements, annonces et nouvelles de l'écurie #514.</p>
    </div>

    <!-- Featured Article -->
    <div id="featuredContainer">
      <div class="loading">Chargement des actualités...</div>
    </div>

    <!-- Other Articles -->
    <div id="otherArticlesContainer" style="display:none;">
      <h2 style="margin:40px 0 20px;">Autres articles</h2>
      <div class="other-articles" id="otherArticles"></div>
    </div>
  </section>
</main>

<!-- Article Modal -->
<div id="articleModal" class="modal">
  <button class="modal-close" onclick="closeModal()">×</button>
  <div class="modal-content">
    <h2 class="modal-title" id="modalTitle"></h2>
    <div class="modal-meta" id="modalMeta"></div>
    <img id="modalImg" class="modal-img" style="display:none;">
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyA1V8_JYnmrKRGd9C0z3eFsB0-tiCXT7G8",
  authDomain: "montreal-racing-team.firebaseapp.com",
  databaseURL: "https://montreal-racing-team-default-rtdb.firebaseio.com",
  projectId: "montreal-racing-team",
  storageBucket: "montreal-racing-team.firebasestorage.app",
  messagingSenderId: "487636328025",
  appId: "1:487637328025:web:6efb48bd15e8ee9133db48",
  measurementId: "G-C21EXWEEFB"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

function loadArticles() {
  const articlesRef = ref(db, 'articles');
  onValue(articlesRef, (snapshot) => {
    if (!snapshot.exists()) {
      document.getElementById('featuredContainer').innerHTML = 
        '<div class="loading">Aucun article pour le moment.</div>';
      return;
    }

    const articles = [];
    snapshot.forEach((childSnapshot) => {
      articles.push({
        id: childSnapshot.key,
        ...childSnapshot.val()
      });
    });

    // Sort by date descending
    articles.sort((a, b) => new Date(b.date) - new Date(a.date));

    // Featured article (latest)
    if (articles.length > 0) {
      const featured = articles[0];
      const featuredHTML = featured.image
        ? `<div class="featured-article">
            <img src="${featured.image}" alt="${featured.title}" class="featured-img">
            <div class="featured-content">
              <div class="featured-meta">${formatDate(featured.date)}</div>
              <h2 class="featured-title">${featured.title}</h2>
              <p class="featured-excerpt">${featured.content.substring(0, 150)}...</p>
              <a href="#" class="featured-btn" onclick="openArticle('${featured.id}', event)">Lire l'article</a>
            </div>
          </div>`
        : `<div class="featured-article no-image">
            <div class="featured-content">
              <div class="featured-meta">${formatDate(featured.date)}</div>
              <h2 class="featured-title">${featured.title}</h2>
              <p class="featured-excerpt">${featured.content.substring(0, 150)}...</p>
              <a href="#" class="featured-btn" onclick="openArticle('${featured.id}', event)">Lire l'article</a>
            </div>
          </div>`;
      
      document.getElementById('featuredContainer').innerHTML = featuredHTML;

      // Other articles
      if (articles.length > 1) {
        const otherArticles = articles.slice(1);
        const otherHTML = otherArticles.map(article => `
          <div class="article-item" onclick="openArticle('${article.id}')">
            ${article.image ? `<img src="${article.image}" alt="${article.title}" class="article-img">` : ''}
            <div class="article-body">
              <div class="article-meta">${formatDate(article.date)}</div>
              <h3 class="article-title">${article.title}</h3>
              <p class="article-excerpt">${article.content.substring(0, 100)}...</p>
            </div>
          </div>
        `).join('');

        document.getElementById('otherArticles').innerHTML = otherHTML;
        document.getElementById('otherArticlesContainer').style.display = 'block';
      }
    }

    // Store articles globally for modal
    window.allArticles = articles;
  });
}

function formatDate(dateStr) {
  const date = new Date(dateStr);
  return date.toLocaleDateString('fr-CA', { year: 'numeric', month: 'long', day: 'numeric' });
}

window.openArticle = function(id, event) {
  if (event) event.preventDefault();
  const article = window.allArticles.find(a => a.id === id);
  if (!article) return;

  document.getElementById('modalTitle').textContent = article.title;
  document.getElementById('modalMeta').textContent = formatDate(article.date);
  
  const imgEl = document.getElementById('modalImg');
  if (article.image) {
    imgEl.src = article.image;
    imgEl.style.display = 'block';
  } else {
    imgEl.style.display = 'none';
  }
  
  document.getElementById('modalBody').innerHTML = article.content;
  document.getElementById('articleModal').classList.add('active');
};

window.closeModal = function() {
  document.getElementById('articleModal').classList.remove('active');
};

// Load on start
loadArticles();

// Reload every 30 seconds for live updates
setInterval(loadArticles, 30000);
</script>

</body>
</html>
